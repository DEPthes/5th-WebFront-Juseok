<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DEPth Web-Front 3week Calculator</title>
    <link rel="stylesheet" href="./style.css" />
    <script src="./script.js" defer></script>
  </head>
  <body>
    <main class="calculator-page">
      <section class="calculator" aria-label="계산기">
        <div class="calculator-screen">
          <output class="calculator-history" id="history" aria-live="polite"></output>
          <output class="calculator-display is-brand" id="display" aria-live="polite">DEPth</output>
        </div>

        <div class="calculator-keypad">
          <button class="key key-clear" type="button" data-action="clear">AC</button>
          <button class="key" type="button" data-action="delete">DEL</button>
          <button class="key key-operator" type="button" data-operator="/">÷</button>

          <button class="key" type="button" data-number="7">7</button>
          <button class="key" type="button" data-number="8">8</button>
          <button class="key" type="button" data-number="9">9</button>
          <button class="key key-operator" type="button" data-operator="*">×</button>

          <button class="key" type="button" data-number="4">4</button>
          <button class="key" type="button" data-number="5">5</button>
          <button class="key" type="button" data-number="6">6</button>
          <button class="key key-operator" type="button" data-operator="-">-</button>

          <button class="key" type="button" data-number="1">1</button>
          <button class="key" type="button" data-number="2">2</button>
          <button class="key" type="button" data-number="3">3</button>
          <button class="key key-operator" type="button" data-operator="+">+</button>

          <button class="key" type="button" data-number="0">0</button>
          <button class="key" type="button" data-number="00">00</button>
          <button class="key" type="button" data-action="decimal">.</button>
          <button class="key key-equals" type="button" data-action="calculate">=</button>
        </div>
      </section>
    </main>
  </body>
</html>
