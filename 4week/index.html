<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DEPth Web-Front 4week Todo List</title>
    <link rel="stylesheet" href="./style.css" />
    <script src="./script.js" defer></script>
  </head>
  <body>
    <main class="todo-page">
      <section class="todo-app" aria-label="Todo 리스트">
        <div class="todo-header">
          <p class="todo-label">4week Todo</p>
          <h1>오늘의 할 일</h1>
        </div>

        <form class="todo-form" id="todoForm">
          <label class="sr-only" for="todoInput">새 할 일</label>
          <input
            id="todoInput"
            class="todo-input"
            type="text"
            placeholder="할 일을 입력하세요"
            autocomplete="off"
            maxlength="40"
          />
          <button class="add-button" type="submit">추가</button>
        </form>

        <ul class="todo-list" id="todoList" aria-live="polite"></ul>

        <div class="todo-footer">
          <p class="todo-count" id="todoCount">0개 항목 남음</p>
        </div>
      </section>
    </main>
  </body>
</html>
